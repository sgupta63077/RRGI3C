<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #main{
            width:100%;
            margin:0px;
            padding:0px;

        }
        h1{
            margin:20px;
            padding :40px;
            

        }

        
               .grid-box{
        
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:10px;
            

        }
        .grid-boxes{
            background-image: url(https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg?s=1024x1024&w=is&k=20&c=MB1-O5fjps0hVPd97fMIiEaisPMEn4XqVvQoJFKLRrQ=);
            width:100%
            height:100px;

        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="main">
        <h1>Grids </h1>
        <div class="grid-box">
            <div class="grid-box">1</div>
            <div class="grid-box">2</div>
            <div class="grid-box">3</div>
            <div class="grid-box">4</div>
            <div class="grid-box">5</div>
            <div class="grid-box">6</div>
            <div class="grid-box">7</div>
            <div class="grid-box">8</div>
            <div class="grid-box">9</div>

        </div>
    </div>
    
</body>
</html>
